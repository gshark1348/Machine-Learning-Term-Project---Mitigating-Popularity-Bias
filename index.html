<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beyond Popularity · 영화 발견</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#f6f5f2;font:15px/1.5 system-ui}main,header{max-width:1480px;margin:auto;padding:24px 5vw}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #343439}b.brand{color:#ff494f;letter-spacing:.08em}small{color:#b5b2bb}h1{font-size:clamp(38px,6vw,80px);line-height:1;margin:20px 0}p{color:#c2bfc6}button,input,select{font:inherit;color:inherit;background:#27272c;border:1px solid #55545d;border-radius:6px;padding:7px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffcb74}#run{background:#b62432;border:0;font-weight:bold;padding:9px 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(145px,42vw),1fr));gap:18px 12px}.rail{display:flex;overflow-x:auto;gap:12px;padding-bottom:12px}.rail article{flex:0 0 155px}article{min-width:0}.cover{position:relative;aspect-ratio:2/3;background:linear-gradient(145deg,#403343,#242c37);border-radius:8px;overflow:hidden;display:grid;place-items:center}.fallback{padding:12px;text-align:center;font:bold 20px Georgia}.cover img,.actions{position:absolute;inset:0;width:100%;height:100%}.cover img{object-fit:cover}.actions{background:#101016ed;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:9px;opacity:0;pointer-events:none}.cover:hover .actions,.cover:focus-within .actions,.cover.open .actions{opacity:1;pointer-events:auto}.hit{position:absolute;inset:0;width:100%;background:transparent;border:0}.actions button,.actions select{width:100%}.title{margin-top:6px;font-size:14px;font-weight:650}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.entry{padding:24px 0}h2{margin:25px 0 12px}.flag{color:#ffc46e}#msg{min-height:1.5em}
 .actions .stars{display:flex;padding:0;border:0;background:transparent;touch-action:manipulation}.stars span{flex:1;font:clamp(18px,2vw,24px)/1.4 system-ui;background:linear-gradient(to right,#ffc46e var(--fill),#686873 var(--fill));color:transparent;background-clip:text}.actions strong{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.actions{overflow-y:auto;gap:4px}.actions .clear{font-size:11px;padding:1px}
 .stats{position:absolute;top:8px;left:8px;background:#18181e;padding:2px 6px;border-radius:4px;color:#ffd283;font-size:12px}.actions{padding-top:30px;cursor:pointer}.title{background:transparent;border:0;padding:0;text-align:left}.why{font-size:12px;color:#c8c4cf;line-height:1.5;margin:5px 0}.rank{font:bold 28px Georgia;color:#ffc46e}dialog{color:#f8f6ee;background:#202027;border:1px solid #48464c;border-radius:12px;width:min(470px,92vw);max-height:85vh;padding:24px}dialog::backdrop{background:#000b}dialog h2{margin:12px 0}dialog button{float:right}.chip{display:inline-block;background:#39343e;border-radius:18px;padding:3px 10px;margin:3px}
.badge{position:absolute;top:0;left:0;z-index:2;pointer-events:none;background:#c52032;color:white;padding:4px 8px;border-radius:0 0 6px 0;font-weight:800;font-size:13px}.cover:has(.badge) .stats{left:auto;right:2px;top:28px}.cover:has(.badge) .actions{padding-top:52px}</style>
<header><b class="brand">BEYOND POPULARITY</b><small>무비 디스커버리 랩</small></header><main><div class="entry"><small>PERSONAL CINEMA / 01</small><h1>나만의 상영관</h1><p>별을 누르고 좌우로 움직여 점수를 고르세요. 다시 누르면 별점과 시청 완료가 함께 저장됩니다.</p><div class="tools"><input type="search" id="query" aria-label="영문 영화 제목" placeholder="영문 영화 제목 검색"><button id="library">내 기록</button><select id="strength" aria-label="인기도 페널티"><option value="">검증된 강도</option><option>0.005</option><option>0.01</option><option>0.015</option><option>0.02</option><option>0.05</option><option>0.1</option><option>0.2</option></select><button id="run">내 추천 보기</button></div><p id="msg" role="status"></p></div><div id="results"></div><h2>인기 영화 TOP 10</h2><small>MovieLens 학습 표본 · 평가자 수 순</small><div id="popular" class="rail"></div><h2 id="heading">영화 둘러보기</h2><div class="grid" id="catalog"></div><button id="more" hidden>영화 더 보기</button></main><dialog id="detail" aria-labelledby="detailTitle"><button id="closeDetail" aria-label="닫기">닫기 ×</button><div id="info"></div></dialog>
<script>
const $=id=>document.getElementById(id), key='beyond-library-v1';let records={};try{records=JSON.parse(localStorage.getItem(key))||{}}catch{}let library=false,seq=0,rev=0;
function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n}
function stats(m){return '★ '+(m.average?.toFixed(1)??'—')+'　👤 '+(m.voters?.toLocaleString()??'—')}
async function showDetail(movie){
 const dialog=$('detail');if(!dialog.open)dialog.showModal();
 const info=$('info');info.replaceChildren(node('h2','',movie.title));
 const ticket=String(movie.movieId);info.dataset.movie=ticket;
 try{const res=await fetch('/movie/'+ticket);if(!res.ok)throw Error();const m=await res.json();if(info.dataset.movie!==ticket)return;
 const title=node('h2','',m.title);title.id='detailTitle';info.replaceChildren(title,node('p','',m.genres.split('|').join(' · ')),
 node('p','','★ '+m.average.toFixed(1)+' / 5　 ·　평가자 '+m.voters.toLocaleString()+'명'),node('small','','MovieLens 학습 표본 기준'),node('h3','','영화의 특징'));
 if(m.tags.length)info.append(...m.tags.map(t=>node('span','chip',t)));else info.append(node('p','','이 작품에는 Tag Genome 정보가 없습니다.'));
 if(movie.reasons){info.append(node('h3','','추천 이유'),...movie.reasons.map(r=>node('p','',r)))}
 }catch{info.append(node('p','','상세 정보를 불러오지 못했습니다.'))}
}
$('closeDetail').onclick=()=>$('detail').close();
let popularMovies=[];
function renderPopular(){const rail=$('popular');let x=rail.scrollLeft;rail.replaceChildren(...popularMovies.map((m,i)=>{let a=card(m);return a}));rail.scrollLeft=x}
fetch('/popular').then(r=>r.json()).then(list=>{popularMovies=list;renderPopular();search()}).catch(()=>{$('popular').textContent='인기 목록을 불러오지 못했습니다.'});
function save(m,patch){let id=m.movieId;records[id]={...records[id],movie:m,...patch};if(!records[id].rating&&!records[id].watched)delete records[id];localStorage.setItem(key,JSON.stringify(records));rev++;$('results').replaceChildren();$('msg').textContent='기록을 저장했습니다. 내 추천 보기로 목록을 갱신하세요.';renderPopular();search()}
function card(m){let a=node('article'),c=node('div','cover'),r=records[m.movieId]||{};c.append(node('div','fallback',m.title));if(m.poster){let img=new Image();img.alt='';img.loading='lazy';img.onerror=()=>img.remove();img.src=m.poster;c.append(img)}
let hit=node('button','hit');hit.ariaLabel=m.title+' 상세 정보';hit.onclick=()=>showDetail(m);let actions=node('div','actions');
const stars=node('button','stars'), hint=node('small'), clear=node('button','clear','별점 삭제');
clear.onclick=()=>save(m,{rating:0});clear.hidden=!r.rating;
let editing=false,value=r.rating||0;
for(let i=0;i<5;i++)stars.append(node('span','','★'));
function paint(){
 Array.from(stars.children).forEach((star,i)=>star.style.setProperty('--fill',Math.max(0,Math.min(1,value-i))*100+'%'));
 hint.textContent=(value?value+'점 · ':'')+(editing?'다시 눌러 저장':'눌러서 조정');
 stars.setAttribute('aria-label',m.title+' 별점 '+hint.textContent);
}
function position(event){let box=stars.getBoundingClientRect();return Math.max(.5,Math.min(5,Math.ceil((event.clientX-box.left)/box.width*10)/2))}
stars.onpointermove=e=>{if(editing){value=position(e);paint()}};
stars.onclick=e=>{if(e.detail)value=position(e);if(editing){save(m,{rating:value||.5,watched:true});return}editing=true;value=value||.5;paint()};
stars.onkeydown=e=>{if(e.key==='Escape'){editing=false;value=r.rating||0;paint()}if(editing&&['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();value=Math.max(.5,Math.min(5,value+(e.key==='ArrowRight'?.5:-.5)));paint()}};
stars.onblur=()=>{editing=false;value=r.rating||0;paint()};paint();let w=node('button','',r.watched?'✓ 시청 완료 취소':'＋ 시청 완료');w.onclick=()=>save(m,{watched:!r.watched});let counts=node('span','stats',stats(m));counts.title='평균 별점 · 평가자 수';actions.onclick=e=>{if(!e.target.closest('button'))showDetail(m)};actions.append(counts,node('strong','',m.title),stars,hint,clear,w);c.append(hit,actions);let rank=popularMovies.findIndex(f=>f.movieId===m.movieId)+1;if(rank)c.append(node("span","badge","TOP "+rank));let title=node('button','title',m.title);title.onclick=()=>showDetail(m);a.append(c,title,node('small','flag',[r.rating?'★ '+r.rating:'',r.watched?'✓ 시청 완료':'',m.tail?'◆ 롱테일':''].filter(Boolean).join(' · ')));if(m.reasons)a.append(node('p','why',m.reasons[0]));return a}
let offset=0;async function search(append=false){if(append!==true){offset=0;append=false}let s=++seq,q=$('query').value.trim();$('heading').textContent=library?'내 기록':q?'검색 결과':'영화 둘러보기';try{let list;if(library){list=Object.values(records).map(r=>r.movie).filter(m=>m.title.toLowerCase().includes(q.toLowerCase()));list=await Promise.all(list.map(async m=>{if(m.voters!=null)return m;const detail=await fetch('/movie/'+m.movieId);return detail.ok?detail.json():m}))}else{let res=await fetch('/movies?q='+encodeURIComponent(q)+'&offset='+offset);if(!res.ok)throw Error();list=await res.json()}if(s!==seq)return;offset+=list.length;$('more').hidden=library||list.length<30;if(append){$('catalog').append(...list.map(card));return}$('catalog').replaceChildren(...(list.length?list.map(card):[node('p','','표시할 영화가 없습니다.')]))}catch{if(s===seq)$('msg').textContent='영화 목록을 불러오지 못했습니다.'}}
$('more').onclick=()=>search(true);$('query').oninput=search;$('library').onclick=()=>{library=!library;$('library').textContent=library?'전체 영화':'내 기록';search()};
$('run').onclick=async()=>{let s=++rev,params=new URLSearchParams(),ratings={};for(let [id,r] of Object.entries(records)){if(r.rating)ratings[id]=r.rating;if(r.watched)params.append('watched',id)}if(!Object.keys(ratings).length){$('msg').textContent='영화 한 편 이상에 별점을 남겨 주세요.';return}if($('strength').value)params.set('strength',$('strength').value);try{let res=await fetch('/recommend?'+params,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ratings)});if(!res.ok)throw Error();let d=await res.json();if(s!==rev)return;$('results').replaceChildren();for(let [k,list] of ['neighbors','adaptive','hybrid','fixed'].map(k=>[k,d.lists[k]])){let rail=node('div','rail');rail.append(...list.map(card));if(!list.length)rail.append(node('p','','공통 평점이 있는 사용자의 추천을 찾지 못했습니다. 다른 영화에도 별점을 남겨 보세요.'));$('results').append(node('h2','',{neighbors:'취향이 비슷한 사람들이 좋아한 영화',hybrid:'기본 추천',fixed:'고정 페널티 추천',adaptive:'나의 발견 추천'}[k]),rail)}$('msg').textContent='별점을 남겼거나 시청을 완료한 영화는 추천에서 제외했습니다.'}catch{$('msg').textContent='추천을 불러오지 못했습니다.'}};search()
</script></html>
